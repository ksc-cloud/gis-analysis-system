# Test-only overrides (classpath:/config wins over classpath:/application.properties and ./application-local.properties).
# Tests never use the development DB gis_analysis. MariaDB integration tests run against gis_analysis_test only when
# GIS_TEST_DB_URL, GIS_TEST_DB_USERNAME and GIS_TEST_DB_PASSWORD are set; otherwise the URL points at a closed port.
spring.datasource.url=${GIS_TEST_DB_URL:jdbc:mariadb://127.0.0.1:9/gis_analysis_test?connectTimeout=1000}
spring.datasource.username=${GIS_TEST_DB_USERNAME:gis_test}
spring.datasource.password=${GIS_TEST_DB_PASSWORD:}
# Tests never call a real Python analysis service: a closed port and no token, even when ANALYSIS_INTERNAL_TOKEN is set.
# PythonServiceLiveTests builds its own client from ANALYSIS_IT_URL / ANALYSIS_IT_TOKEN.
analysis-service.base-url=http://127.0.0.1:9
analysis-service.internal-token=
