spring.application.name=gis-analysis-system

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MariaDB (analysis history). Development DB only; tests use gis_analysis_test through GIS_TEST_DB_* variables.
# Never commit a password: put spring.datasource.password in ./application-local.properties (git-ignored)
# or set GIS_DB_PASSWORD. The app starts without a database; only /api/analyses needs it (503 when it is down).
spring.datasource.url=${GIS_DB_URL:jdbc:mariadb://127.0.0.1:3306/gis_analysis?connectTimeout=3000}
spring.datasource.username=${GIS_DB_USERNAME:gis_app}
spring.datasource.password=${GIS_DB_PASSWORD:}
spring.datasource.hikari.pool-name=gis-db
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
# Tables are created by db/mariadb/*.sql, never by the application.
spring.sql.init.mode=never
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=10

# VWorld 3D Map API key. Never commit a real key.
# Set the VWORLD_API_KEY environment variable, or put vworld.api-key in ./application-local.properties (git-ignored).
spring.config.import=optional:file:./application-local.properties
vworld.api-key=${VWORLD_API_KEY:}
# Service URL registered when the VWorld key was issued. Sent as the "domain" parameter
# when the server calls the VWorld 2D data API. Override with VWORLD_DOMAIN.
vworld.domain=${VWORLD_DOMAIN:http://localhost:8080}

# Python spatial analysis service (analysis-service/, FastAPI). Called server to server only; the browser never sees
# this address or the token. The URL must be http(s) on a loopback address (127.0.0.1, localhost, ::1); any other value
# disables the integration. Without ANALYSIS_INTERNAL_TOKEN only the spatial analysis endpoints answer 503; the map,
# the radius analysis and the history work whether or not Python runs. Never commit a token: use the environment
# variable (the same one the Python server reads) or ./application-local.properties (git-ignored).
analysis-service.base-url=${ANALYSIS_SERVICE_URL:http://127.0.0.1:8001}
analysis-service.internal-token=${ANALYSIS_INTERNAL_TOKEN:}
analysis-service.connect-timeout=1s
analysis-service.read-timeout=15s
analysis-service.compare-read-timeout=30s
analysis-service.status-timeout=2s
analysis-service.max-concurrent-requests=2
analysis-service.unavailable-cooldown=10s
# Same limits as the Python server (ANALYSIS_MAX_BODY_BYTES / ANALYSIS_COMPARE_MAX_BODY_BYTES); MB = 1024 * 1024 bytes.
analysis-service.max-request-bytes=16MB
analysis-service.compare-max-request-bytes=32MB
analysis-service.max-response-bytes=64MB
